name: Chain

# The chain is 32-bit PE on real Windows: Wine has accepted executables that
# Windows refuses, so a run under Wine does not stand in for this one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows on ${{ matrix.os }}
    # The chain is 32-bit x86 on both: x64 Windows runs it on the CPU through
    # WOW64, and ARM64 Windows through its x86 emulator. Each can fail where
    # the other does not, so one failing does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # A hung tool has to end the run, not hold it to the six hour limit.
    timeout-minutes: 20
    steps:
      # The runner's Git rewrites line endings on checkout, and the tools have
      # to read the bytes that were committed.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the chain
        shell: cmd
        run: x86\mescc-tools-mini.cmd

      - name: hex0 reproduces the seed
        shell: pwsh
        run: |
          $seed = (Get-FileHash bootstrap-seeds/PE32/i386/hex0-seed.exe).Hash
          $hex0 = (Get-FileHash x86/artifact/hex0.exe).Hash
          $hex1 = (Get-FileHash x86/artifact/hex1.exe).Hash
          if ($seed -ne $hex0) { throw "hex0.exe is not the seed: $hex0, expected $seed" }
          if ($hex0 -eq $hex1) { throw "hex0.exe and hex1.exe match, so this comparison proves nothing" }
          Get-FileHash x86/artifact/*.exe | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }

      - name: kaem passes its own tests
        shell: pwsh
        run: x86/kaem-test.ps1

      # The chain assembles and links with M0 and the hand-written hex2. The
      # M1 and hex2 it compiles from C are what upstream builds every later
      # stage with, so from the input the chain built them from they have to
      # rebuild both of themselves byte for byte. The base address is the
      # ImageBase PE32-i386.hex2 declares.
      - name: M1 and hex2 from C rebuild themselves
        shell: pwsh
        working-directory: x86
        run: |
          $tools = @(
            @{ name = 'M1'; libc = 'libc-bootstrap.M1'; source = 'M1-macro.M1' }
            @{ name = 'hex2-new'; libc = 'libc-full.M1'; source = 'hex2_linker.M1' }
          )
          foreach ($tool in $tools) {
            $hex2 = "artifact/$($tool.name)-c.hex2"
            $exe = "artifact/$($tool.name)-c.exe"
            ./artifact/M1.exe --architecture x86 --little-endian `
              -f ../M2libc/x86/x86_defs.M1 -f libc-core.M1 -f $tool.libc `
              -f "artifact/$($tool.source)" -f pe-end-shim.M1 -o $hex2
            if ($LASTEXITCODE -ne 0) { throw "M1 failed on $($tool.source) with $LASTEXITCODE" }
            ./artifact/hex2-new.exe --architecture x86 --little-endian --base-address 0x400000 `
              -f PE32-i386.hex2 -f ntdll-i386.hex2 -f $hex2 -o $exe
            if ($LASTEXITCODE -ne 0) { throw "hex2 failed on $hex2 with $LASTEXITCODE" }
            $want = (Get-FileHash "artifact/$($tool.name).exe").Hash
            $got = (Get-FileHash $exe).Hash
            if ($want -ne $got) { throw "$exe is $got, $($tool.name).exe is $want" }
            "$got  $($tool.name).exe, rebuilt by M1 and hex2"
          }
