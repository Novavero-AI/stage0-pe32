name: Chain

# The chain is 32-bit PE on real Windows: Wine has accepted executables that
# Windows refuses, so a run under Wine does not stand in for this one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows on ${{ matrix.os }}
    # The chain is 32-bit x86 on both: x64 Windows runs it on the CPU through
    # WOW64, and ARM64 Windows through its x86 emulator. Each can fail where
    # the other does not, so one failing does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # A hung tool has to end the run, not hold it to the six hour limit.
    timeout-minutes: 20
    steps:
      # The runner's Git rewrites line endings on checkout, and the tools have
      # to read the bytes that were committed.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the chain
        shell: cmd
        run: x86\mescc-tools-mini.cmd

      - name: hex0 reproduces the seed
        shell: pwsh
        run: |
          $seed = (Get-FileHash bootstrap-seeds/PE32/i386/hex0-seed.exe).Hash
          $hex0 = (Get-FileHash x86/artifact/hex0.exe).Hash
          $hex1 = (Get-FileHash x86/artifact/hex1.exe).Hash
          if ($seed -ne $hex0) { throw "hex0.exe is not the seed: $hex0, expected $seed" }
          if ($hex0 -eq $hex1) { throw "hex0.exe and hex1.exe match, so this comparison proves nothing" }
          Get-FileHash x86/artifact/*.exe | ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" }

      - name: kaem passes its own tests
        shell: pwsh
        run: x86/kaem-test.ps1

      # The chain assembles and links with M0 and the hand-written hex2. The
      # M1 and hex2 it compiles from C are what upstream builds every later
      # stage with, so from the input the chain built them from they have to
      # rebuild both of themselves byte for byte. The base address is the
      # ImageBase PE32-i386.hex2 declares.
      - name: M1 and hex2 from C rebuild themselves
        shell: pwsh
        working-directory: x86
        run: |
          $tools = @(
            @{ name = 'M1'; libc = 'libc-bootstrap.M1'; source = 'M1-macro.M1' }
            @{ name = 'hex2-new'; libc = 'libc-full.M1'; source = 'hex2_linker.M1' }
          )
          foreach ($tool in $tools) {
            $hex2 = "artifact/$($tool.name)-c.hex2"
            $exe = "artifact/$($tool.name)-c.exe"
            ./artifact/M1.exe --architecture x86 --little-endian `
              -f ../M2libc/x86/x86_defs.M1 -f libc-core.M1 -f $tool.libc `
              -f "artifact/$($tool.source)" -f pe-end-shim.M1 -o $hex2
            if ($LASTEXITCODE -ne 0) { throw "M1 failed on $($tool.source) with $LASTEXITCODE" }
            ./artifact/hex2-new.exe --architecture x86 --little-endian --base-address 0x400000 `
              -f PE32-i386.hex2 -f ntdll-i386.hex2 -f $hex2 -o $exe
            if ($LASTEXITCODE -ne 0) { throw "hex2 failed on $hex2 with $LASTEXITCODE" }
            $want = (Get-FileHash "artifact/$($tool.name).exe").Hash
            $got = (Get-FileHash $exe).Hash
            if ($want -ne $got) { throw "$exe is $got, $($tool.name).exe is $want" }
            "$got  $($tool.name).exe, rebuilt by M1 and hex2"
          }

      # Returning from main is an exit, so a stream nothing closed is flushed
      # before the process ends. The program writes a line to a file through
      # stdio and returns without closing it, built the way Phase-7 builds
      # hex2-new.
      - name: Returning from main flushes stdio
        shell: pwsh
        working-directory: x86
        run: |
          function step { & $args[0] @($args | Select-Object -Skip 1); if ($LASTEXITCODE -ne 0) { throw "$($args[0]) exited $LASTEXITCODE" } }
          $libc = 'sys/types.h', 'stddef.h', 'sys/utsname.h', 'x86/windows/ntdll.c',
            'x86/windows/unistd.c', 'x86/windows/process.c', 'x86/windows/fcntl.c', 'fcntl.c',
            'x86/windows/sys/stat.c', 'ctype.c', 'stdlib.c', 'stdarg.h', 'stdio.h', 'stdio.c',
            'bootstrappable.c' | ForEach-Object { '-f'; "../M2libc/$_" }
          step ./artifact/M2.exe --architecture x86 -D __windows__=1 @libc `
            -f Development/exit-flush-test.c -o artifact/exit-flush-test.M1
          step ./artifact/catm.exe artifact/exit-flush-test-0.M1 ../M2libc/x86/x86_defs.M1 `
            libc-core.M1 libc-full.M1 artifact/exit-flush-test.M1 pe-end-shim.M1
          step ./artifact/M0.exe artifact/exit-flush-test-0.M1 artifact/exit-flush-test.hex2
          step ./artifact/catm.exe artifact/exit-flush-test-0.hex2 PE32-i386.hex2 ntdll-i386.hex2 `
            artifact/exit-flush-test.hex2
          step ./artifact/hex2.exe artifact/exit-flush-test-0.hex2 artifact/exit-flush-test.exe
          Push-Location artifact
          try { step ./exit-flush-test.exe } finally { Pop-Location }
          $got = [IO.File]::ReadAllText((Join-Path $PWD 'artifact/exit-flush.txt'))
          if ($got -ne "flushed`n") { throw "exit-flush.txt holds '$got', not the line the program wrote" }
          "exit-flush.txt holds the line the program wrote and never closed"

      # chmod keeps the owner execute bit as the nova.exec stream beside a
      # file, which nova-nix reads as the executable bit of a Nix archive. The
      # program calls chmod once on its arguments and is linked by hex2-new,
      # whose own chmod(output, 0750) has to mark it. PowerShell reads the
      # streams through Win32, not through M2libc. x is a one-letter name,
      # which Win32 would read as a drive with :nova.exec after it. The modes
      # are quoted so that each reaches the program as the octal it reads.
      - name: chmod sets and clears the executable bit
        shell: pwsh
        working-directory: x86
        run: |
          function step { & $args[0] @($args | Select-Object -Skip 1); if ($LASTEXITCODE -ne 0) { throw "$($args[0]) exited $LASTEXITCODE" } }
          function marked($path) { [bool](Get-Item -LiteralPath $path -Stream nova.exec -ErrorAction SilentlyContinue) }
          $libc = 'sys/types.h', 'stddef.h', 'sys/utsname.h', 'x86/windows/ntdll.c',
            'x86/windows/unistd.c', 'x86/windows/process.c', 'x86/windows/fcntl.c', 'fcntl.c',
            'x86/windows/sys/stat.c', 'ctype.c', 'stdlib.c', 'stdarg.h', 'stdio.h', 'stdio.c',
            'bootstrappable.c' | ForEach-Object { '-f'; "../M2libc/$_" }
          step ./artifact/M2.exe --architecture x86 -D __windows__=1 @libc `
            -f Development/chmod-test.c -o artifact/chmod-test.M1
          step ./artifact/catm.exe artifact/chmod-test-0.M1 ../M2libc/x86/x86_defs.M1 `
            libc-core.M1 libc-full.M1 artifact/chmod-test.M1 pe-end-shim.M1
          step ./artifact/M0.exe artifact/chmod-test-0.M1 artifact/chmod-test.hex2
          step ./artifact/hex2-new.exe --architecture x86 --little-endian --base-address '0x400000' `
            -f PE32-i386.hex2 -f ntdll-i386.hex2 -f artifact/chmod-test.hex2 -o artifact/chmod-test.exe
          if (-not (marked artifact/chmod-test.exe)) { throw "hex2 did not mark chmod-test.exe" }
          Push-Location artifact
          try {
            Set-Content -LiteralPath chmod.txt -Value 'chmod' -NoNewline
            step ./chmod-test.exe '0755' chmod.txt
            if (-not (marked chmod.txt)) { throw "chmod 0755 did not mark chmod.txt" }
            $held = Get-Content -LiteralPath chmod.txt -Stream nova.exec -Raw
            if ($held -ne '1') { throw "chmod.txt:nova.exec holds '$held', not 1" }
            step ./chmod-test.exe '0755' chmod.txt
            if (-not (marked chmod.txt)) { throw "a second chmod 0755 unmarked chmod.txt" }
            step ./chmod-test.exe '0644' chmod.txt
            if (marked chmod.txt) { throw "chmod 0644 left chmod.txt marked" }
            step ./chmod-test.exe '0644' chmod.txt
            if (marked chmod.txt) { throw "a second chmod 0644 marked chmod.txt" }
            $body = Get-Content -LiteralPath chmod.txt -Raw
            if ($body -ne 'chmod') { throw "chmod.txt holds '$body', not what was written to it" }
            & ./chmod-test.exe '0755' missing.txt
            if ($LASTEXITCODE -ne 1) { throw "chmod 0755 on a missing file exited $LASTEXITCODE, not 1" }
            if (Test-Path -LiteralPath missing.txt) { throw "chmod 0755 on a missing file made it" }
            Set-Content -LiteralPath x -Value 'x' -NoNewline
            step ./chmod-test.exe '0755' x
            if (-not (marked x)) { throw "chmod 0755 did not mark x" }
          } finally { Pop-Location }
          "chmod marks and unmarks a file, fails on a missing one, and hex2 marks what it links"

      # malloc's blocks are aligned for any object whatever came before them
      # and wherever the program's data ended, which sets where the heap
      # starts. Windows rejects a file call whose name's buffer is at an odd
      # address, so chmod failed in any program whose data ended at an odd
      # byte. The program allocates each size from 1 to 39 both ways and
      # exits 1 at the first block not on an 8-byte boundary.
      - name: malloc returns aligned memory
        shell: pwsh
        working-directory: x86
        run: |
          function step { & $args[0] @($args | Select-Object -Skip 1); if ($LASTEXITCODE -ne 0) { throw "$($args[0]) exited $LASTEXITCODE" } }
          $libc = 'sys/types.h', 'stddef.h', 'sys/utsname.h', 'x86/windows/ntdll.c',
            'x86/windows/unistd.c', 'x86/windows/process.c', 'x86/windows/fcntl.c', 'fcntl.c',
            'x86/windows/sys/stat.c', 'ctype.c', 'stdlib.c', 'stdarg.h', 'stdio.h', 'stdio.c',
            'bootstrappable.c' | ForEach-Object { '-f'; "../M2libc/$_" }
          step ./artifact/M2.exe --architecture x86 -D __windows__=1 @libc `
            -f Development/malloc-align-test.c -o artifact/malloc-align-test.M1
          step ./artifact/catm.exe artifact/malloc-align-test-0.M1 ../M2libc/x86/x86_defs.M1 `
            libc-core.M1 libc-full.M1 artifact/malloc-align-test.M1 pe-end-shim.M1
          step ./artifact/M0.exe artifact/malloc-align-test-0.M1 artifact/malloc-align-test.hex2
          step ./artifact/catm.exe artifact/malloc-align-test-0.hex2 PE32-i386.hex2 ntdll-i386.hex2 `
            artifact/malloc-align-test.hex2
          step ./artifact/hex2.exe artifact/malloc-align-test-0.hex2 artifact/malloc-align-test.exe
          step ./artifact/malloc-align-test.exe
          "every block malloc and calloc returned is 8-byte aligned"
